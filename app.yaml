runtime: nodejs22
env: standard
service: oneticket-cooperate-fe

env_variables:
  NODE_ENV: 'production'

handlers:
  # Serve Next build assets
  - url: /_next/static
    static_dir: .next/static
    http_headers:
      Cache-Control: public, max-age=31536000, immutable
    secure: always

  # Public assets (optional)
  - url: /(favicon\.ico|robots\.txt|sitemap\.xml)
    static_files: public/\1
    upload: public/(favicon\.ico|robots\.txt|sitemap\.xml)

  - url: /(.*\.(png|jpg|jpeg|gif|svg|webp|avif|ico|txt|xml|woff2?|ttf|eot))
    static_files: public/\1
    upload: public/.*\.(png|jpg|jpeg|gif|svg|webp|avif|ico|txt|xml|woff2?|ttf|eot)
    http_headers:
      Cache-Control: public, max-age=604800

  # Everything else to Next server
  - url: /.*
    script: auto

